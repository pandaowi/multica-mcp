version: '3.8'

services:
  # Multica MCP Server backend
  multica-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/pandaowi/multica-mcp:latest
    container_name: multica-mcp-app
    restart: always
    command: ["--transport", "sse", "--port", "3000", "--host", "0.0.0.0"]
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - MULTICA_MCP_TRANSPORT=sse
    expose:
      - "3000"
    volumes:
      - mcp_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal-net

  # Secure Nginx Reverse Proxy with SSE streaming support & SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: multica-mcp-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      multica-mcp:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - internal-net
      - public-net

networks:
  internal-net:
    internal: true
  public-net:
    driver: bridge

volumes:
  mcp_logs:
    name: multica_mcp_prod_logs
  nginx_logs:
    name: multica_nginx_logs
